<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kirana Billing Workflow</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f2f5fa;
      padding: 14px;
      color: #222;
    }

    .container {
      max-width: 520px;
      margin: auto;
    }

    .header {
      text-align: center;
      margin-bottom: 16px;
    }

    .header h1 {
      color: #0f4c81;
      font-size: 24px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .tab-btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 14px;
      font-weight: bold;
      cursor: pointer;
      background: #dfe8f5;
      color: #0f4c81;
    }

    .tab-btn.active {
      background: linear-gradient(90deg,#0f9d58,#0f4c81);
      color: white;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    }

    h2 {
      color: #0f4c81;
      margin-bottom: 14px;
      font-size: 20px;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #ccc;
      margin-top: 10px;
      font-size: 14px;
    }

    button {
      border: none;
      background: linear-gradient(90deg,#0f9d58,#0f4c81);
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .item-row {
      margin-top: 10px;
    }

    .bill-card {
      background: #eef5ff;
      padding: 12px;
      border-radius: 14px;
      margin-bottom: 12px;
    }

    .bill-card h3 {
      color: #0f4c81;
      margin-bottom: 6px;
      font-size: 17px;
    }

    .item-box {
      background: white;
      border-radius: 10px;
      padding: 10px;
      margin-top: 10px;
    }

    .price-input {
      margin-top: 8px;
    }

    .total {
      font-size: 18px;
      font-weight: bold;
      color: #0f9d58;
      margin-top: 10px;
    }

    .status {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      margin-top: 8px;
      background: #ffe9b3;
      color: #8a5a00;
    }

    .completed {
      background: #c8f7d1;
      color: #0f7a2f;
    }

    .search-box {
      margin-bottom: 10px;
    }

    @media(max-width:480px){
      body {
        padding: 10px;
      }

      .tabs {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

<div class="container">

  <div class="header">
    <h1>Kirana Billing System</h1>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="showScreen('shopkeeper')">Shopkeeper</button>
    <button class="tab-btn" onclick="showScreen('accountant')">Accountant</button>
  </div>

  <div id="shopkeeper" class="screen active">

    <div class="card">
      <h2>Create Bill</h2>

      <input type="date" id="billDate" />

      <input type="text" id="customerName" placeholder="Customer Name" />

      <div id="itemsContainer"></div>

      <button onclick="addItem()">+ Add Item</button>

      <select id="assignUser">
        <option value="Accountant">Accountant</option>
      </select>

      <button onclick="submitBill()">Submit Bill</button>
    </div>

    <div class="card">
      <h2>Reports</h2>

      <input type="text" id="searchCustomer" class="search-box" placeholder="Search Customer" onkeyup="renderReports()" />

      <div id="reportList"></div>
    </div>

  </div>

  <div id="accountant" class="screen">

    <div class="card">
      <h2>Pending Bills</h2>
      <div id="pendingBills"></div>
    </div>

  </div>

</div>

<script>

const API_URL = 'https://script.google.com/macros/s/AKfycbzO2wXtX7T29s3csdGlEr_FENPTIZm9O1AguO6kfN7g8ckiwxnad8rkHSj_0UPamDv6/exec';

let reports = [];

function showScreen(screenId) {
  document.querySelectorAll('.screen').forEach(screen => {
    screen.classList.remove('active');
  });

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.classList.remove('active');
  });

  document.getElementById(screenId).classList.add('active');

  event.target.classList.add('active');

  if(screenId === 'accountant') {
    loadPendingBills();
  }
}

function addItem() {
  const container = document.getElementById('itemsContainer');

  const row = document.createElement('div');
  row.className = 'item-row';

  row.innerHTML = `
    <input type="text" class="itemName" placeholder="Item Name (Example: Sugar 10 kg)" />
  `;

  container.appendChild(row);
}

async function submitBill() {

  const itemInputs = document.querySelectorAll('.itemName');

  let items = [];

  itemInputs.forEach(input => {
    if(input.value.trim() !== '') {
      items.push({
        itemName: input.value,
        price: 0
      });
    }
  });

  const payload = {
    action: 'saveBill',
    billDate: document.getElementById('billDate').value,
    customerName: document.getElementById('customerName').value,
    assignedTo: 'Accountant',
    items: items
  };

  const response = await fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify(payload)
  });

  const result = await response.json();

  alert('Bill Submitted Successfully');

  document.getElementById('customerName').value = '';
  document.getElementById('itemsContainer').innerHTML = '';

  addItem();

  loadReports();
}

async function loadPendingBills() {

  const response = await fetch(API_URL + '?action=getPendingBills&assignedTo=Accountant');

  const result = await response.json();

  const container = document.getElementById('pendingBills');

  container.innerHTML = '';

  result.data.forEach(bill => {

    let itemsHtml = '';

    bill.items.forEach(item => {
      itemsHtml += `
        <div class="item-box">
          <div>${item.itemName}</div>
          <input type="number" class="price-input" placeholder="Enter Price" data-bill="${bill.billId}" data-item="${item.itemName}" value="${item.price || ''}" />
        </div>
      `;
    });

    container.innerHTML += `
      <div class="bill-card">
        <h3>${bill.customerName}</h3>
        <div>Date: ${bill.billDate}</div>
        <div class="status">Pending</div>
        ${itemsHtml}
        <button onclick="completeBill('${bill.billId}')">Complete Bill</button>
      </div>
    `;
  });
}

async function completeBill(billId) {

  const inputs = document.querySelectorAll(`[data-bill="${billId}"]`);

  let items = [];

  inputs.forEach(input => {
    items.push({
      itemName: input.dataset.item,
      price: Number(input.value || 0)
    });
  });

  const payload = {
    action: 'updateBill',
    billId: billId,
    items: items
  };

  const response = await fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify(payload)
  });

  const result = await response.json();

  alert('Bill Completed');

  loadPendingBills();
  loadReports();
}

async function loadReports() {

  const response = await fetch(API_URL + '?action=searchBills&customerName=');

  const result = await response.json();

  reports = result.data;

  renderReports();
}

function renderReports() {

  const search = document.getElementById('searchCustomer').value.toLowerCase();

  const container = document.getElementById('reportList');

  container.innerHTML = '';

  reports
    .filter(bill => bill.customerName.toLowerCase().includes(search))
    .forEach(bill => {

      container.innerHTML += `
        <div class="bill-card">
          <h3>${bill.customerName}</h3>
          <div>Date: ${bill.billDate}</div>
          <div>Total: ₹ ${bill.total}</div>
          <div class="status ${bill.status === 'Completed' ? 'completed' : ''}">
            ${bill.status}
          </div>
          <button onclick="window.print()">Print</button>
        </div>
      `;
    });
}

addItem();
loadReports();

</script>

</body>
</html>
