<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kirana Billing System</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f2f5fa;
    padding:12px;
}

.container{
    max-width:520px;
    margin:auto;
}

.title{
    text-align:center;
    margin-bottom:15px;
    color:#0f4c81;
}

.tabs{
    display:flex;
    gap:10px;
    margin-bottom:15px;
}

.tabs button{
    flex:1;
    padding:14px;
    border:none;
    border-radius:12px;
    font-weight:bold;
    cursor:pointer;
    background:#dce7f5;
    color:#0f4c81;
}

.tabs button.active{
    background:linear-gradient(90deg,#0f9d58,#0f4c81);
    color:white;
}

.screen{
    display:none;
}

.screen.active{
    display:block;
}

.card{
    background:white;
    border-radius:18px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 4px 14px rgba(0,0,0,0.08);
}

h2{
    color:#0f4c81;
    margin-bottom:12px;
}

input,
button{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #ccc;
    margin-top:10px;
    font-size:14px;
}

button{
    border:none;
    background:linear-gradient(90deg,#0f9d58,#0f4c81);
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.bill-card{
    background:#eef5ff;
    border-radius:14px;
    padding:12px;
    margin-top:12px;
}

.bill-card h3{
    color:#0f4c81;
    margin-bottom:5px;
}

.item-box{
    background:white;
    padding:10px;
    border-radius:10px;
    margin-top:10px;
}

.total{
    margin-top:10px;
    font-size:18px;
    font-weight:bold;
    color:#0f9d58;
}

.status{
    display:inline-block;
    padding:5px 10px;
    border-radius:20px;
    font-size:12px;
    margin-top:8px;
    background:#ffe7b3;
    color:#8a5a00;
    font-weight:bold;
}

.completed{
    background:#c8f7d1;
    color:#0b7a2b;
}

.loading{
    text-align:center;
    padding:15px;
    color:#666;
}

@media(max-width:480px){

    .tabs{
        flex-direction:column;
    }

}

</style>
</head>

<body>

<div class="container">

    <h1 class="title">
        Kirana Billing System
    </h1>

    <div class="tabs">

        <button id="shopBtn"
                class="active"
                onclick="showScreen('shopkeeper')">

            Shopkeeper

        </button>

        <button id="accBtn"
                onclick="showScreen('accountant')">

            Accountant

        </button>

    </div>

    <!-- SHOPKEEPER -->

    <div id="shopkeeper" class="screen active">

        <div class="card">

            <h2>Create Bill</h2>

            <input type="date" id="billDate">

            <input type="text"
                   id="customerName"
                   placeholder="Customer Name">

            <div id="itemsContainer"></div>

            <button onclick="addItem()">
                + Add Item
            </button>

            <button onclick="submitBill()">
                Submit Bill
            </button>

        </div>

        <div class="card">

            <h2>Reports</h2>

            <input type="text"
                   id="searchCustomer"
                   placeholder="Search Customer"
                   onkeyup="loadReports()">

            <div id="reportsContainer"></div>

        </div>

    </div>

    <!-- ACCOUNTANT -->

    <div id="accountant" class="screen">

        <div class="card">

            <h2>Pending Bills</h2>

            <div id="pendingContainer">

                <div class="loading">
                    Loading...
                </div>

            </div>

        </div>

    </div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbzO2wXtX7T29s3csdGlEr_FENPTIZm9O1AguO6kfN7g8ckiwxnad8rkHSj_0UPamDv6/exec";

function showScreen(screen){

    document.getElementById("shopkeeper")
        .classList.remove("active");

    document.getElementById("accountant")
        .classList.remove("active");

    document.getElementById("shopBtn")
        .classList.remove("active");

    document.getElementById("accBtn")
        .classList.remove("active");

    if(screen === "shopkeeper"){

        document.getElementById("shopkeeper")
            .classList.add("active");

        document.getElementById("shopBtn")
            .classList.add("active");

    }
    else{

        document.getElementById("accountant")
            .classList.add("active");

        document.getElementById("accBtn")
            .classList.add("active");

        loadPendingBills();

    }

}

function addItem(){

    const div = document.createElement("div");

    div.innerHTML = `

        <input type="text"
               class="itemName"
               placeholder="Item Example: Sugar 10kg">

    `;

    document.getElementById("itemsContainer")
        .appendChild(div);

}

async function submitBill(){

    try{

        const customerName =
            document.getElementById("customerName")
            .value.trim();

        const billDate =
            document.getElementById("billDate")
            .value;

        const itemInputs =
            document.querySelectorAll(".itemName");

        let items = [];

        itemInputs.forEach(input => {

            if(input.value.trim() !== ""){

                items.push({

                    itemName:input.value.trim(),
                    price:0

                });

            }

        });

        if(customerName === ""){

            alert("Enter customer name");
            return;

        }

        if(items.length === 0){

            alert("Add items");
            return;

        }

        const payload = {

            action:"saveBill",
            billDate:billDate,
            customerName:customerName,
            assignedTo:"Accountant",
            items:items

        };

        const response = await fetch(API_URL,{

            method:"POST",

            headers:{
                "Content-Type":"text/plain;charset=utf-8"
            },

            body:JSON.stringify(payload)

        });

        const result = await response.json();

        console.log(result);

        if(result.success){

            alert("Bill Submitted");

            document.getElementById("customerName")
                .value = "";

            document.getElementById("itemsContainer")
                .innerHTML = "";

            addItem();

            loadReports();

        }
        else{

            alert(result.message || "Submission Failed");

        }

    }
    catch(error){

        console.log(error);

        alert("Error submitting bill");

    }

}

async function loadPendingBills(){

    try{

        const response = await fetch(

            API_URL +
            "?action=getPendingBills&assignedTo=Accountant"

        );

        const result = await response.json();

        console.log(result);

        const container =
            document.getElementById("pendingContainer");

        container.innerHTML = "";

        if(!result.data || result.data.length === 0){

            container.innerHTML =
                "<div class='loading'>No Pending Bills</div>";

            return;

        }

        result.data.forEach(bill => {

            let itemsHtml = "";

            bill.items.forEach(item => {

                itemsHtml += `

                    <div class="item-box">

                        <div>
                            ${item.itemName}
                        </div>

                        <input type="number"
                               placeholder="Enter Price"
                               data-bill="${bill.billId}"
                               data-item="${item.itemName}"
                               value="${item.price || ''}">

                    </div>

                `;

            });

            container.innerHTML += `

                <div class="bill-card">

                    <h3>
                        ${bill.customerName}
                    </h3>

                    <div>
                        Date: ${bill.billDate}
                    </div>

                    <div class="status">
                        Pending
                    </div>

                    ${itemsHtml}

                    <button
                        onclick="completeBill('${bill.billId}')">

                        Complete Bill

                    </button>

                </div>

            `;

        });

    }
    catch(error){

        console.log(error);

    }

}

async function completeBill(billId){

    try{

        const inputs =
            document.querySelectorAll(
                `[data-bill="${billId}"]`
            );

        let items = [];

        inputs.forEach(input => {

            items.push({

                itemName:input.dataset.item,
                price:Number(input.value || 0)

            });

        });

        const payload = {

            action:"updateBill",
            billId:billId,
            items:items

        };

        const response = await fetch(API_URL,{

            method:"POST",

            headers:{
                "Content-Type":"text/plain;charset=utf-8"
            },

            body:JSON.stringify(payload)

        });

        const result = await response.json();

        if(result.success){

            alert("Bill Completed");

            loadPendingBills();

            loadReports();

        }
        else{

            alert("Update Failed");

        }

    }
    catch(error){

        console.log(error);

        alert("Error Updating Bill");

    }

}

async function loadReports(){

    try{

        const search =
            document.getElementById("searchCustomer")
            .value;

        const response = await fetch(

            API_URL +
            "?action=searchBills&customerName=" +
            encodeURIComponent(search)

        );

        const result = await response.json();

        const container =
            document.getElementById("reportsContainer");

        container.innerHTML = "";

        if(!result.data || result.data.length === 0){

            container.innerHTML =
                "<div class='loading'>No Reports Found</div>";

            return;

        }

        result.data.forEach(bill => {

            container.innerHTML += `

                <div class="bill-card">

                    <h3>
                        ${bill.customerName}
                    </h3>

                    <div>
                        Date: ${bill.billDate}
                    </div>

                    <div class="total">
                        ₹ ${bill.total}
                    </div>

                    <div class="status ${
                        bill.status === "Completed"
                        ? "completed"
                        : ""
                    }">

                        ${bill.status}

                    </div>

                    <button onclick="window.print()">
                        Print
                    </button>

                </div>

            `;

        });

    }
    catch(error){

        console.log(error);

    }

}

document.getElementById("billDate").value =
    new Date().toISOString().split("T")[0];

addItem();

loadReports();

</script>

</body>
</html>
